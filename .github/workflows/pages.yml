name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master, ccr-9900845d-jyhk35]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site with version info
        run: |
          mkdir _site && cp -r index.html style.css version.js turn.js game.js app.js vendor .nojekyll _site/
          SHA="${GITHUB_SHA::7}"
          sed -i "s/build: 'dev'/build: '$SHA'/; s/date: ''/date: '$(date -u +%Y-%m-%d)'/" _site/version.js
          sed -i -E "s/(src=\"[^\"]+\.js)\"/\1?v=$SHA\"/g; s/(href=\"style\.css)\"/\1?v=$SHA\"/" _site/index.html
          cat _site/version.js; grep -E 'src=|style.css' _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
