name: Deploy game server to Cloudflare
on:
  push:
    branches: [main, ccr-9900845d-jyhk35]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN ir CLOUDFLARE_ACCOUNT_ID dar nepridėti (Settings → Secrets and variables → Actions). Serveris neįkeltas."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
      - name: Deploy with Wrangler
        if: steps.check.outputs.ok == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Serveris įkeltas" >> "$GITHUB_STEP_SUMMARY"
          echo "Adresas: \`$URL\` – įrašyk jį į config.js" >> "$GITHUB_STEP_SUMMARY"
          echo "Server URL: $URL"
